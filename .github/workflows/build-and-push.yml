name: Build and Push

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

concurrency:
  group: build-and-push-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/cd-chief/dev-portfolio

jobs:
  build-and-push:
    # Manual runs from other branches should not push images
    if: github.ref_name == 'main' || github.ref_name == 'dev'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # main -> ghcr.io/cd-chief/dev-portfolio:main (moving tag)
      # main -> ghcr.io/cd-chief/dev-portfolio:main-<short-sha> (rollback target)
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,format=short,prefix=${{ github.ref_name }}-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Deploy by tag: the apps in Coolify carry the tag, so no resource IDs are stored here.
      # dev -> <repo>-staging, main -> <repo>-production (repo name lowercased)
      - name: Resolve deploy target
        id: target
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          repo="${GITHUB_REPOSITORY#*/}"
          repo="${repo,,}"
          if [ "$GITHUB_REF_NAME" = "main" ]; then env_name=production; else env_name=staging; fi
          tag="${repo}-${env_name}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Expected Coolify tag: $tag"
          if [ -n "$COOLIFY_URL" ] && [ -n "$COOLIFY_TOKEN" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "::warning::COOLIFY_URL or COOLIFY_TOKEN is not set, so the image was pushed but not deployed"
          fi

      # Explicit POST, response written to a file and printed, any non-2xx fails the job.
      # Plain curl fail mode would hide the response body that explains why.
      - name: Deploy on Coolify
        if: steps.target.outputs.deploy == 'true'
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          DEPLOY_TAG: ${{ steps.target.outputs.tag }}
        run: |
          code=$(curl -sS -X POST \
            -H "Authorization: Bearer $COOLIFY_TOKEN" \
            -H "Accept: application/json" \
            -o response.json -w "%{http_code}" \
            "${COOLIFY_URL%/}/api/v1/deploy?tag=${DEPLOY_TAG}&force=false")
          echo "Deploy tag: $DEPLOY_TAG"
          echo "HTTP $code"
          cat response.json
          echo
          case "$code" in
            2??) ;;
            *) echo "Deploy request failed"; exit 1 ;;
          esac
